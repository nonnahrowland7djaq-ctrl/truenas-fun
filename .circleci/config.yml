            echo "phase-feat-2656=$(wc -c </tmp/yarn/CXaj)"
      - persist_to_workspace:
          root: /tmp/yarn
          paths:
            - 'CXaj'
  feat-2656:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/yarn
      - run:
          name: Load step-3 output
          command: |
            cat /tmp/yarn/CXaj 2>/dev/null | tee >(wc -l) > /dev/null || true
      - run:
          name: Materialize tree
          command: git clone --depth 3 --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Checkout vendored deps
          command: tar --extract --bzip2 --file=dev-cache-v5.tar.bz2
      - run:
          name: Store metadata
          command: sleep 45
      - run:
          command: "./ward-driver"
